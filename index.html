<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SR Doctor — 启动说明</title>
</head>
<body>
  <main>
    <h1>SR Doctor</h1>
    <p>这是仓库根目录的静态说明页，不是产品入口。产品页面由 <code>doctor-api</code> 提供，源码在 <code>frontend/</code>。</p>

    <h2>服务器部署</h2>
    <pre>./deploy.sh</pre>
    <p>完成后按提示在浏览器打开 <code>服务器地址:8000</code>，输入访问令牌。</p>

    <h2>本机运行</h2>
    <pre>npm --prefix frontend ci
npm --prefix frontend run build
cargo run -p doctor-api</pre>
    <p>启动后打开 <code>127.0.0.1:8000</code>。</p>

    <p>完整说明见 <code>README.md</code> 与 <code>docs/guide/deployment.md</code>。</p>
  </main>
</body>
</html>
