# SR Doctor server deployment. From the repository root:
#
#   docker compose up -d --build        # or: docker-compose up -d --build (1.29+)
#
# Then open http://<server>:8000, sign in as admin / 123456, and connect to any
# StarRocks FE by host, port, user and password. `./deploy.sh` wraps this same
# file with status, backup, upgrade and offline packages.
#
# Settings (port, bind address, login password, HTTPS cookies) go in a `.env`
# file next to this one; local additions (a private CA, extra mounts) go in
# compose.override.yaml, which Compose merges automatically. Both are ignored by
# Git. See docs/guide/deployment.md and docs/guide/configuration.md.
name: sr-doctor

services:
  doctor:
    build:
      context: .
      dockerfile: Dockerfile
    image: sr-doctor:local
    # One container needs no network of its own; the default bridge also avoids
    # exhausting Docker's address pools on busy hosts.
    network_mode: bridge
    environment:
      DOCTOR_DEPLOYMENT_MODE: network
      DOCTOR_LISTEN: 0.0.0.0:8000
      # Login account; empty means the default admin / 123456.
      DOCTOR_ADMIN_USER: "${DOCTOR_ADMIN_USER:-}"
      DOCTOR_ADMIN_PASSWORD: "${DOCTOR_ADMIN_PASSWORD:-}"
      DOCTOR_FRONTEND_DIST: /app/frontend
      DOCTOR_HISTORY_PATH: /var/lib/sr-doctor/history.sqlite
      # "on" when users reach the server over HTTPS (a TLS reverse proxy).
      DOCTOR_COOKIE_SECURE: "${DOCTOR_COOKIE_SECURE:-off}"
      # Remote clusters are only collected for trends and alerts once the
      # production read-only pilot (G1) has passed; leave empty until then.
      DOCTOR_COLLECTION_ALLOW_REMOTE: "${DOCTOR_COLLECTION_ALLOW_REMOTE:-}"
    ports:
      # Listen on every interface by default; set DOCTOR_BIND to one address to narrow it.
      - "${DOCTOR_BIND:-0.0.0.0}:${DOCTOR_PORT:-8000}:8000"
    volumes:
      - doctor-history:/var/lib/sr-doctor
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v1/health HTTP/1.0\\r\\nHost: 127.0.0.1:8000\\r\\n\\r\\n' >&3 && grep -q '\"ok\"' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  doctor-history:
