[workspace]
members = [
  "backend/crates/doctor-contracts",
  "backend/crates/doctor-core",
  "backend/crates/doctor-api",
  "backend/crates/doctor-export",
  "backend/crates/doctor-connector",
  "backend/crates/doctor-history",
  "backend/crates/rule-sets/doctor_v0_1",
  "backend/crates/version-packs/starrocks_3_5_14",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "1.0.0"
license = "Apache-2.0"

[workspace.dependencies]
axum = "0.8.8"
getrandom = "0.3.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8.3"
schemars = "0.8.22"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha1 = "0.10.7"
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
time = { version = "0.3.55", features = ["formatting"] }
ts-rs = "10.1.0"
tower = { version = "0.5.2", features = ["util"] }
